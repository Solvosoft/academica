[program:academica]
command=/app/gunicorn_start
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx-app]
command=/usr/sbin/nginx
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; worker y beat solo arrancan con SERVICE_TYPE=all (ver entrypoint.sh)
[program:academicaworker]
command=/usr/local/bin/celery -A academica worker --loglevel=INFO -c 2
directory=/app/src
user=academica
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=600
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:academicabeat]
command=/usr/local/bin/celery -A academica beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid
directory=/app/src
user=academica
autostart=false
autorestart=true
startsecs=10
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
