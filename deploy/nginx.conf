upstream app_academica {
    server unix:/app/run/gunicorn.sock fail_timeout=0;
} 

server {
	listen 80 default_server;
	server_name _;
	client_max_body_size 20M;

    location /static/ {
        alias /run/static/;
    }
    
    # Certificados y comprobantes: los autoriza Django (academica/media_access.py)
    # y el archivo lo entrega el `location /_protected/` de abajo. Van ANTES de
    # `/media/` por ser prefijos mas especificos.
    location /media/certificates/ {
        try_files /dev/null @app;
    }

    location /media/bank/ {
        try_files /dev/null @app;
    }

    # El resto del media es publico: imagenes de cursos, categorias, fotos de
    # perfil y lo que sube el editor.
    location /media/ {
        alias /app/media/;
    }

    # Solo alcanzable por X-Accel-Redirect desde la aplicacion, nunca desde
    # fuera: `internal` es lo que lo hace privado.
    location /_protected/ {
        internal;
        alias /app/media/;
    }

    location @app {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_pass http://app_academica;
    }

    location / {
        # an HTTP header important enough to have its own Wikipedia entry:
        #   http://en.wikipedia.org/wiki/X-Forwarded-For
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Se pasa tal como llega. El TLS lo termina el proxy de delante
        # (Traefik / el hub), y settings.SECURE_PROXY_SSL_HEADER lee esta
        # cabecera para saber que la peticion original era https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # pass the Host: header from the client right along so redirects
        # can be set properly within the Rack application
        proxy_set_header Host $http_host;

        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_redirect off;

        # set "proxy_buffering off" *only* for Rainbows! when doing
        # Comet/long-poll stuff.  It's also safe to set if you're
        # using only serving fast clients with Unicorn + nginx.
        # Otherwise you _want_ nginx to buffer responses to slow
        # clients, really.
        proxy_buffering off;
        proxy_set_header                Cookie $http_cookie;
        proxy_pass_request_headers      on;
        # Try to serve static files from nginx, no point in making an
        # *application* server like Unicorn/Rainbows! serve static files.
        if (!-f $request_filename) {
            proxy_pass http://app_academica;
            break;
        }
    }
}