{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<div class="row">
		<div class="col-md-10 col-md-offset-1">
			<h1 class="text-center">Matricula</h1>
			<div class="x_panel">
				<form method="POST">
					{% csrf_token %}
					<div class="x_title">
						<h2 class="green">Editar matricula</h2>
						<ul class="nav navbar-right panel_toolbox">
						</ul>
						<div class="clearfix"></div>
					</div>
					<div class="x_content">
						{{form.as_horizontal}}
					</div>
					<div class="text-center">
						<a class="btn btn-dark" href="{% url 'enrolls' %}">Cancelar</a>
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
				</form>
			</div>
		</div>
	</div>
{%endblock%}
