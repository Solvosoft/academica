{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Categorías</h1>
	<div id="group_message"></div>
	<div class="row">
		<div class="col-md-6 col-sm-12 col-lg-8">
			<div class="x_panel">
				<div class="x_content">
					<form method="GET">
						<div>
							{{form_search.as_inline}}
						</div>
						<div class="text-right">
							<a style="margin-top:10px;" href="{% url 'categories' %}" class="btn btn-dark">Limpiar</a>
							<button style="margin-top:10px;" class="btn btn-success" type="submit">Buscar</button>
						</div>
					</form>
				</div>
			</div>
			{% for category in object_list %}
				<div class="col-md-6">
					<div class="x_panel">
						<div class="x_title">
							<h2>{{category.name}}</h2>
							<ul class="nav navbar-right panel_toolbox">
								<li>
									<a class="none-link"><i class="fa fa-eye"></i></a>
								</li>
								<li>
									<a class="edit-link"><i class="fa fa-edit"></i></a>
								</li>
								<li>
									<a class="delete-link"><i class="fa fa-close"></i></a>
								</li>
							</ul>
							<div class="clearfix"></div>
						</div>
					</div>
				</div>
			{% endfor %}
		</div>
		<div class="col-md-6 col-sm-12 col-lg-4">
			<div class="x_panel">
				<form method="POST">
					<div class="x_title">
						<h2>Nueva categoría</h2>
						<ul class="nav navbar-right panel_toolbox">
						</ul>
						<div class="clearfix"></div>
					</div>
					<div class="x_content">
						{{form}}
					</div>
					<div class="text-right">
						<input value="Cancelar" class="btn btn-dark" type="reset" />
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
				</form>
			</div>
		</div>
	</div>
{%endblock%}
