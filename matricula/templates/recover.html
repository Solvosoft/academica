{%load i18n %}	
<div class="x_title">
    <h2 class="green">{% trans 'Forget your password?' %}</h2> 
    <ul class="nav navbar-right panel_toolbox" style="min-width:none;"></ul>
    <div class="clearfix"></div>
</div>
<div class="x_content">
    <form method="post" action="{% url 'mail_recover_pass'%}" data-ajax-submit="" onsubmit="return false;">
            {% csrf_token %}
        <label>Correo: </label><input type="text" class="form-control" name='email'>
        <div class="text-right" style="margin-top:10px;">
            <button type="submit" class="btn btn-primary">{% trans 'Recover my password' %}</button>
        </div>
    </form>
    <p> {% trans 'We will send you an email with necessary information for change your password' %} </p>

    {%if recover_message%}
        <div class="alert alert-{{recover_message_type}}" role="alert"> {{recover_message}} </div>
    {% endif %}
</div>
