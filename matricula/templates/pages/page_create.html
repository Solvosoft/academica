{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Formulario de Páginas</h1>
	<div div class="col-sm-12 col-md-10 col-lg-10 col-xs-12 col-md-offset-1">
		<div class="x_panel">
			<form method="POST">
				{% csrf_token %}
				<div class="x_title">
					<h3 class="green">Formulario Página</h3>
					<div class="clearfix"></div>
				</div>
				<div class="x_content">
					<div>
						{{form.as_horizontal}}
					</div>
					<div class="text-right" style="padding-top: 10px;">
						<a class="btn btn-dark" href="{% url 'pages' %}">Cancelar</a>
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
					<div class="clearfix"></div>
				</div>
			</form>
		</div>
	</div>
	<div class="clearfix"></div>
{%endblock%}
