{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Detalle Curso</h1>
	<div class="row">
		<div class="col-md-6 col-sm-12 col-lg-12">
			<div class="x_panel">
				<div class="x_title">
					<h3 class="green">{{object.name}}</h3>
					<div class="clearfix"></div>
				</div>
				<div class="x_panel">
					<div class="x_content">
						<label>Categoría: </label> {{object.category.name}}
						{{object.description|safe}}
					</div>
				</div>
				<div class="clearfix"></div>
			</div>
		</div>
	</div>
{%endblock%}
