{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Crear Curso</h1>
	<div class="x_panel">
		<form method="POST">
			{% csrf_token %}
			<div class="x_title">
				<h3 class="green">Formulario de cursos</h3>
				<div class="clearfix"></div>
			</div>
			<div class="x_content">
				<div>
					{{form.as_inline}}
				</div>
				<div class="text-right">
					<a class="btn btn-dark" href="{% url 'enrrolment_courses' %}">Cancelar</a>
					<input class="btn btn-primary" value="Guardar" type="submit"/>
				</div>
			</div>
		</form>
	</div>
{%endblock%}
