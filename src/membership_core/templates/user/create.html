{% extends 'gentelella/base.html' %}
{% load static %}
{% block content %}
<div class="row">
    <div class='col-md-8 col-md-offset-2 col-xs-12'>
        <br/>
        <div class="alert alert-info">Para crear estudiantes dar click <a class="btn btn-warning" href="{% url 'create_student' %}">aquí</a></div>
        <br/>
        <div class="x_panel">
            <div class="x_title">
                <h1 class="text-center">Crear Usuarie</h1>
                <div class="clearfix"></div>
            </div>
            <div class="x_content">
                <form method="post">
                    {% csrf_token %}
                    {{form.as_horizontal}}
                    <br>
                    <div class="form-group" style="text-align:center">
                        <a class="btn btn-danger" type="button" href="{% url 'user_list' %}">Cancelar</a>
                        <button class="btn btn-success" type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
