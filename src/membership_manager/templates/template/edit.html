{% extends 'gentelella/base.html' %}

{% load static %}
{% block extra_css %}
    <link href="{% static 'css/membership.css' %}" rel="stylesheet">
{% endblock extra_css %}

{% block content %}
<div class="row">
    <div class='col-md-2'></div>
    <div class='col-md-8'>
        <div class="x_panel">

            <div class="x_title">
                {% if perms.admin.view_logentry %}
                <div class="row">
                    <div class="col-sm-10">
                        <h1 class="text-center">Editar plantilla</h1>
                    </div>
                    <div class="col-sm-2">
                        <ul class="nav navbar-right panel_toolbox">
                            <li><a title="Ver historial" href="{% url 'logentry_object' app='membership_core' model='membershiptemplate' pk=membershiptemplate %}" class="edit-link" style='font-size:2em'><i class="fa fa-history green"></i></a></li>
                        </ul>
                    </div>
                </div>
                {% else %}
                    <h1 class="text-center">Editar plantilla</h1>
                {% endif %}
                <div class="clearfix"></div>
            </div>
            <div class="x_content">
                <form method="post">
                    {% csrf_token %}
                    {{form.as_horizontal}}
                    <br>
                    <div class="form-group" style="text-align:center">
                        <a class="btn btn-danger" type="button" href="{% url 'templates' %}">Cancelar</a>
                        <button class="btn btn-success" type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class='col-md-2'></div>
</div>
{% endblock content %}
