{% extends 'gentelella/base.html' %}

{% load static %}

{% block content %}
<div class="x_panel">
    <div class="x_title">
        {% if perms.admin.view_logentry %}
        <div class="row">
            <div class="col-sm-10">
                <h1 class="text-center">Editar reporte de atención</h1>
            </div>
            <div class="col-sm-2">
                <ul class="nav navbar-right panel_toolbox">
                    <li><a title="Ver historial" href="{% url 'logentry_object' app='membership_manager' model='activityreport' pk=activityreport %}" class="edit-link" style='font-size:2em'><i class="fa fa-history green"></i></a></li>
                </ul>
            </div>
        </div>
         {% else %}
                    <h1 class="text-center">Editar reporte de atención</h1>
                {% endif %}
        <div class="clearfix"></div>
    </div>
 <div class="x_content">
  <form method="POST" >{% csrf_token %}
      {{ form.as_horizontal }}
        <div class="row">
           <div class="text-right">
               <a href="{% url 'activityreport-list' %}" class="btn btn-dark">Cancelar</a>
               <button class="btn btn-success" type="submit"  >Guardar</button>
           </div>
       </div>
  </form>
 </div>
</div>

{% endblock %}
