{% extends 'gentelella/base.html'%}
{% load static i18n %}
{% block content %}
	<h1 class="text-center">{% trans 'Bills' %}</h1>
	<div div class="col-sm-12 col-md-10 col-lg-10 col-xs-12 col-md-offset-1">
		<div class="x_panel">
			<form method="POST">
				{% csrf_token %}
				<div class="x_title">
					<h2 class="green">{% trans 'New bill' %}</h2>
					<div class="clearfix"></div>
				</div>
				<div class="x_content">
					<div>
						{{form.as_horizontal}}
					</div>
					<div class="text-right">
						<a class="btn btn-dark" href="{% url 'listbills' %}">{% trans 'Cancel' %}</a>
						<input class="btn btn-primary" value="{% trans 'Save' %}" type="submit"/>
					</div>
					<div class="clearfix"></div>
				</div>
			</form>
		</div>
	</div>
	<div class="clearfix"></div>
{% endblock %}
