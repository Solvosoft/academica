{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1 class="text-center">Elementos del Menú</h1>
	<div class="row">
		<form method="POST">
			<div class="col-md-8">
				<div class="x_panel">
					{% csrf_token %}
					<div class="x_title">
						<h2 class="green">Editar menú</h2>
						<ul class="nav navbar-right panel_toolbox">
						</ul>
						<div class="clearfix"></div>
					</div>
					<div class="x_content">
						{{form.as_horizontal}}
					</div>
					<div class="text-right">
						<a class="btn btn-dark" href="{% url 'menuitems' %}">Cancelar</a>
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
				</div>
			</div>
			<div class="col-md-4">
				<div class="x_panel">
					<div class="x_title">
						<h1 class="text-center">Permisos</h1>
						<div class="clearfix"></div>
					</div>
					<div class="x_content">
						{{permsForm.permission}}
						{{permsForm.permission.errors }}
					</div>
				</div>
			</div>
		</form>
	</div>
{%endblock%}
