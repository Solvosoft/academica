{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Elementos del menú</h1>
	<form method="POST">
		<div div class="col-md-10 col-md-offset-1">
			<div class="x_panel">
				{% csrf_token %}
				<div class="x_title">
					<h3 class="green">Crear menú</h3>
					<div class="clearfix"></div>
				</div>
				<div class="x_content">
					<div>
						{{form.as_horizontal}}
					</div>
					<div class="text-right">
						<a class="btn btn-dark" href="{% url 'menuitems' %}">Cancelar</a>
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
				</div>
			</div>
		</div>
	</form>
{%endblock%}
