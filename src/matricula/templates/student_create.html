{% extends 'gentelella/base.html'%}
{% load socialaccount static i18n %}
{% block extra_css%}
	<link rel="stylesheet" href="{% static 'css/auth-buttons.css'%}">
{%endblock%}
{%block content%}
	<h1>Registro de usuarios</h1>
	<div class="row">
		<div class="col-md-12 text-center" style="margin-bottom: 15px;">
			<a class="btn-auth btn-facebook" style="display:inline-bock;" href="{% provider_login_url 'facebook' method='oauth2' %}"> Facebook</a>
			<a class="btn-auth btn-google"  style="display:inline-block;" href="{% provider_login_url 'google' method='oauth2' %}">Google</a>
			<a class="btn-auth btn-github"  style="display:inline-block;" href="{% provider_login_url 'github' method='oauth2' %}">Github</a>    
		</div>
	</div>
	<div class="col-md-8 col-md-offset-2">
		<div class="x_panel">
			<div class="x_title">
				<h2 class="green"> {% trans 'Your data' %}</h2>
				<ul></ul>
				<div class="clearfix"></div>
			</div>
			<div class="x_content">
				<div class="row">
					<div>
						<form method="post" id="{% url 'create_user' %}">
								{% csrf_token %}
								{{form.as_table}}
							<div style="margin-top:10px; text-align:right;">
								<button type="submit" class="btn btn-success" value="Save" >
									<span class="glyphicon glyphicon-envelope" aria-hidden="true"></span> Registar
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
{%endblock%}
{% block js %}
	<script type="text/javascript" src="{% static 'django_ajax/js/jquery.ajax.min.js' %}"></script>
	<script type="text/javascript" src="{% static 'django_ajax/js/jquery.ajax-plugin.min.js' %}"></script>
{% endblock %}
