{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1>Páginas</h1>
	<div class="row">
		<form method="POST">
			<div div class="col-md-10 col-md-offset-1">
				<div class="x_panel">
					{% csrf_token %}
					<div class="x_title">
						<h2 class="green">Crear página</h2>
						<div class="clearfix"></div>
					</div>
					<div class="x_content">
						<div>
							{{form.as_horizontal}}
						</div>
						<div class="text-right" style="padding-top: 10px;">
							<a class="btn btn-dark" href="{% url 'pages' %}">Cancelar</a>
							<input class="btn btn-primary" value="Guardar" type="submit"/>
						</div>
						<div class="clearfix"></div>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div class="clearfix"></div>
{%endblock%}
