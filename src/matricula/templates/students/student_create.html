{% extends 'gentelella/base.html'%}
{% load static %}
{% block content %}
	<h1 class="text-center">Estudiantes</h1>
	<div div class="col-sm-12 col-md-10 col-lg-10 col-xs-12 col-md-offset-1">
		<div class="x_panel">
			<div class="x_title">
				<h3 class="green">Crear estudiante</h3>
				<div class="clearfix"></div>
			</div>
			<div class="x_content">
				<ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
					<li class="nav-item">
						<a class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" href="#pills-home" role="tab" aria-controls="pills-home" aria-selected="true">Crear usuarie</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" href="#pills-profile" role="tab" aria-controls="pills-profile" aria-selected="false">Seleccionar usuarie</a>
					</li>
				</ul>
				<div class="tab-content" id="pills-tabContent">
					<div class="tab-pane fade active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
						<br/>
						<form method="POST">
							{% csrf_token %}
							<div>
								{{form.as_horizontal}}
							</div>
							<div class="text-right">
								<a class="btn btn-dark" href="{% url 'students' %}">Cancelar</a>
								<input class="btn btn-primary" name="new" value="Guardar" type="submit"/>
							</div>
						</form>
					</div>
					<div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
						<br/>
						<form method="POST">
							{% csrf_token %}
							<div>
								{{form_user.as_horizontal}}
							</div>
							<div class="text-right">
								<a class="btn btn-dark" href="{% url 'students' %}">Cancelar</a>
								<input class="btn btn-primary" name="created" value="Guardar" type="submit"/>
							</div>
						</form>
					</div>
				</div>
				<div class="clearfix"></div>
			</div>
		</div>
	</div>
	<div class="clearfix"></div>
{% endblock %}
{% block js %}
	<script>
		var input = document.querySelector('#id_organization'),
		tagify = new Tagify(input, {whitelist:[]}),
		controller; // for aborting the call
		// listen to any keystrokes which modify tagify's input
		tagify.on('input', onInput)
		function onInput( e ){
			var value = e.detail.value;
			tagify.settings.whitelist.length = 0; // reset the whitelist

			// https://developer.mozilla.org/en-US/docs/Web/API/AbortController/abort
			controller && controller.abort();
			controller = new AbortController();

			// show loading animation and hide the suggestions dropdown
			tagify.loading(true).dropdown.hide.call(tagify)

			fetch("/gtapis/student/?q="+e.detail.value, {signal:controller.signal})
				.then(RES => RES.json())
				.then(function(whitelist){
				// update inwhitelist Array in-place
				var whitelst = []
				for(rows of whitelist.results){
					tags = JSON.parse(rows.text)
					for(tag of tags){
						whitelst.push(tag.value)
					}
				}
				whitelst = [...new Set(whitelst)];
				tagify.settings.whitelist.splice(0, whitelist.total_count, ...whitelst)
				tagify.loading(false).dropdown.show.call(tagify); // render the suggestions dropdown
			})
		}
		$(document).ready(function(){
			$('#pills-tab li:{{form_show}} a').tab('show')
		});
		$('#id_user').css('width','100%');
		$('select').css('width','100%');
		var input2 = document.querySelector('#id_organization2'),
		tagify2 = new Tagify(input2, {whitelist:[]}),
		controller2; // for aborting the call
		// listen to any keystrokes which modify tagify's input
		tagify2.on('input', onInput2)
		function onInput2( e ){
			var value = e.detail.value;
			tagify2.settings.whitelist.length = 0; // reset the whitelist

			// https://developer.mozilla.org/en-US/docs/Web/API/AbortController/abort
			controller2 && controller2.abort();
			controller2 = new AbortController();

			// show loading animation and hide the suggestions dropdown
			tagify2.loading(true).dropdown.hide.call(tagify2)

			fetch("/gtapis/student/?q="+e.detail.value, {signal:controller2.signal})
				.then(RES => RES.json())
				.then(function(whitelist2){
				// update inwhitelist Array in-place
				var whitelst2 = []
				for(rows of whitelist2.results){
					tags = JSON.parse(rows.text)
					for(tag of tags){
						whitelst2.push(tag.value)
					}
				}
				whitelst2 = [...new Set(whitelst2)];
				tagify2.settings.whitelist.splice(0, whitelist2.total_count, ...whitelst2)
				tagify2.loading(false).dropdown.show.call(tagify2, value); // render the suggestions dropdown
			})
		}
	</script>
{% endblock %}
