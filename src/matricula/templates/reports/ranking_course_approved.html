{% extends 'gentelella/base.html'%}
{% load static i18n %}
{% load gtsettings %}

{% block pre_head %}
    {% define_true "use_datatables" %}
{% endblock %}

{% block content %}

<div class="clearfix"></div>
<br><br>
<div class="col-md-12">
    <div class="x_panel">
        <div class="x_title">
            <h3 class="green">{{title}}</h3>
        </div>

        <div class="x_content">
                        <div class="row"><form method="get" id="filterform">
                <div class="col-md-10">
                {{form.as_horizontal}}
                </div><div class="col-md-2">
                <button type="submit" class="btn btn-info">Filtrar</button>

                </div>

            </form>
            </div>
            <table id="course_approved_id" class="table"> </table>
        </div>
    </div>
</div>

{% endblock %}

{% block js %}

{{block.super}}

<script>

    document.approve_group_enrolls_url = "{% url 'ranking_group_enrolls' 0 %}";
        document.groups = "";
        document.course = "";


    function load_groups(groups, name){
        var content = "";
        var content_groups = "";
        Array.from(groups).forEach(function(element) {
            content = "<tr class='"+name+"' style='background-color: #ededed; display: none;'>"
            content += "<td><div style='margin-left: 5%;'>"+element['name']+"</div></td><td>"+element['course_approved_count']+"</td><td>"+element['duration_hours']+"</td></tr>";
            content_groups += content;
        });


        $(document.course).after(content_groups);
    }

    function show_groups(btn){
        $(btn).css("color", "#7e90a3");
        var id = $(btn).data("key");
        if($("."+id).is(":visible") == true){
            $("."+id).hide();
            $(btn).html($(btn).html().replace("-", "+"));
            $(btn).parent().parent().css("font-weight", "normal");
            $(btn).css("font-weight", "normal");
        }else{
            $("."+id).show();
            if($("."+id).is(":visible")){
                $(btn).html($(btn).html().replace("+", "-"));
                $(btn).parent().parent().css("font-weight", "bold");
                $(btn).css("font-weight", "bold");
            }
        }


    }

    function collapsed_course(data, type, row, meta){

        var btn = "";
        var name = data.replaceAll(' ','');
        name = name.replaceAll(':','');
        name = name.replaceAll(',','');
        name = name.replaceAll('#','');

        if(data){
            if(row['has_groups']){
                btn += "<button class='btn border-white' type='button' onclick='show_groups(this)' data-id='"+row['id']+"' data-key='"+"collapse"+row['id']
                btn += "' style='background-color:white;'>+ "+data+"</button>"
            }else{
                btn = "<div style='margin-left: 4%;'>"+data+"</div>";
            }
        }
        return btn;
    }


    $(document).ready(function () {
        createDataTable("#course_approved_id", "{{url}}", {
            'columns': [
                {data: "name", name: "name", title: "Nombre del curso", type: "string", visible: true, render: collapsed_course},
                {data: "approved_count", name: "approved_count", title: "Cantidad de aprobados", type: "string", visible: true},
                {data: "workload", name: "workload", title: "Carga Horaria", type: "string", visible: true}

            ],
             ajax: {
             url: '{{url}}',
                type: 'GET',
                data: function(dataTableParams, settings) {
                    var data = formatDataTableParams(dataTableParams, settings);
                    var formdata = $("#filterform").serializeArray();
                    var keys=Object.keys(data);
                    for(var x=0; x<keys.length; x++){
                        formdata.push({
                        'name': keys[x],
                        'value': data[keys[x]]
                        })
                    }
                    return formdata;
                }
            }

        });

        $('#course_approved_id').on('draw.dt', function() {
            Array.from($("#course_approved_id tr.odd, #course_approved_id tr.even")).forEach(function(element) {

                var id = $($(element).children().children()[0]).data('id');
                if(id){

                    var url = document.approve_group_enrolls_url;
                    url = url.replace('0', id);

                    $.ajax({
                        method: 'GET',
                        url: url,
                        dataType: 'json',
                        success: function (data) {
                            if(data.result == "ok"){
                                document.course = element;
                                var btn = $($(document.course).children().children()[0]);
                                var name = $(btn).data('key');
                                if(data.groups){
                                    load_groups(data.groups, name);
                                }
                            }
                        }
                    });
                }
            });
        });
    });

</script>

{% endblock %}
