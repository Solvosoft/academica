{% extends 'gentelella/base.html'%}
{% load static i18n %}
{% load gtsettings %}

{% block pre_head %}
    {% define_true "use_datatables" %}
{% endblock %}

{% block content %}
<div class="clearfix"></div>
<br><br>
<div class="col-md-12">
    <div class="x_panel">
        <div class="x_title">
            <h3 class="green">{{title}}</h3>
        </div>

        <div class="x_content">
            <div class="row"><form method="get" id="filterform">
                <div class="col-md-10">
                {{form.as_horizontal}}
                </div><div class="col-md-2">
                <button type="submit" class="btn btn-info">Filtrar</button>

                </div>

            </form>
            </div>
            <table id="ranking_course_id" class="table"> </table>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}

{{block.super}}

<script>
    $(document).ready(function () {
        createDataTable("#ranking_course_id", "{{url}}",{
            'columns': [
                {data: "name", name: "name", title: "Nombre", type: "string", visible: true},
                {data: "enroll_count", name: "enroll_count", title: "Cantidad de matriculados", type: "string", visible: true},
                {data: "workload", name: "workload", title: "Carga Horaria", type: "string", visible: true}

            ],
             ajax: {
             url: '{{url}}',
                type: 'GET',
                data: function(dataTableParams, settings) {
                    var data = formatDataTableParams(dataTableParams, settings);
                    var formdata = $("#filterform").serializeArray();
                    var keys=Object.keys(data);
                    for(var x=0; x<keys.length; x++){
                        formdata.push({
                        'name': keys[x],
                        'value': data[keys[x]]
                        })
                    }
                    return formdata;
                }
            }
            } )
    });

</script>

{% endblock %}
