{% load static %}
{% load invoice_code %}
<html>
    <head>
        <title>Facturación</title>

        <style>
          @page {

            size: landscape;;

              @frame header_frame {
                    -pdf-frame-content: header_content1;
                    left: 1.5cm;
                    width: 13cm;
                    top: 2.5cm;
                    height: .80cm;
              }

            @frame {
                -pdf-frame-content: logo;
                left: 15.5cm;
                width: 13cm;
                top: 2.5cm;
                height: 11cm;
            }

            @frame {
                -pdf-frame-content: footer;
                right: 6cm;
                width: 18cm;
                top: 10.5cm;
                height: 3cm;
                font-family: Segoe UI;
            }

            @frame {
                -pdf-frame-content: start_text;
                right: 6cm;
                width: 18cm;
                top: 8.5cm;
                height: 3cm;
                font-family: Segoe UI;
            }

            @frame {
                -pdf-frame-content: end_text;
                right: 6cm;
                width: 18cm;
                top: 13.5cm;
                height: 3cm;
                font-family: Segoe UI;
            }

            @frame {
                -pdf-frame-content: short_text;
                right: 6cm;
                width: 18cm;
                top: 16.5cm;
                height: 3cm;
                font-family: Segoe UI;
            }
        }


        /* Page layout */
        body {
            font-family: Helvetica, "sansserif";
        }

        #footer {
            grid-area: foot;
            font-size: 45pt;
            text-align: center;
            vertical-align: middle;
            color: black;
            font-weight: bold;
        }

        .description_text {
            grid-area: foot;
            font-size: 20pt;
            text-align: center;
            vertical-align: middle;
            color: black;
        }

        #short_text {
            grid-area: foot;
            font-size: 13pt;
            text-align: center;
            vertical-align: middle;
            color: black;
        }

    </style>

    </head>
    <body>

            <div id="logo">
                <img src="http://www.universidadpopular.us/wp-content/uploads/2018/10/cropped-UP_logo_Square-e1539875905697-7.png" alt="logo"/>
            </div>


            <div class="description_text" id="start_text">
                Otorgamos el presente certificado a
            </div>

            <div id="footer">
                {{ enroll.student }}
            </div>

            <div class="description_text" id="end_text">
                por la conlusión de curso {{enroll.group.course}} con una nota de {{enroll.course_score}}.
            </div>
            <div id="short_text">
                Emitido en la Universidad Popular el {{date}}.
            </div>

    </body>
</html>
