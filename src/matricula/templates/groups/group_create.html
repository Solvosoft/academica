{% extends 'gentelella/base.html'%}
{% load static %}
{%block content%}
	<h1 class="text-center">Grupos</h1>
	<div div class="col-sm-12 col-md-10 col-lg-10 col-xs-12 col-md-offset-1">
		<div class="x_panel">
			<form method="POST">
				{% csrf_token %}
				<div class="x_title">
					<h2 class="green">Crear grupo</h2>
					<div class="clearfix"></div>
				</div>
				<div class="x_content">
					<div>
						{{form.as_horizontal}}
					</div>
					<div class="text-right">
						<a class="btn btn-dark" href="{% url 'groups_enroll' %}">Cancelar</a>
						<input class="btn btn-primary" value="Guardar" type="submit"/>
					</div>
					<div class="clearfix"></div>
				</div>
			</form>
		</div>
	</div>
	<div class="clearfix"></div>
{%endblock%}
{%block js%}
	<script>
		$(document).ready(function(){
			$('#id_is_paid').change(function () {
				if (!$(this).prop("checked")) {
					$("#id_cost").val(0)
					$('#id_currency').prop('required',false);	
					return;
				}else{
					$('#id_currency').prop('required',true);	
				}
			});
			//Button add period
			bntItem = "<div class='text-right' style='margin-top:5px'>"+
				"<a title='Nuevo periodo' href='/enrrolment/periods'" +
				" style='font-size:2em' target='_blank'><i class='fa fa-plus-square'></i></a></div>";
			$('#id_period').parent().append(bntItem);
		});
	</script>
{%endblock%}
